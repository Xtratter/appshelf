# Server build on every push, pull request and tag: unit tests + release APK (unsigned) as a downloadable artifact.
# Checks that the app builds on a clean Linux machine, the way F-Droid builds it — not only in Termux.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Unit tests and release build
        run: ./gradlew testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AppShelf-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
